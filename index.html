<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WPMCalc</title>
<style>
    body {
        font-family: Comic Sans MS, sans-serif;
        background: black;         
        color: rgb(217, 227, 54);             
        padding: 40px;
        max-width: 600px;
        margin: auto;
    }
    h1 {
        font-family: Comic Sans MS, sans-serif;
        text-align: center;
        color: rgb(217, 227, 54);              
    }
    .box {
        font-family: Comic Sans MS, sans-serif;
        background: #111;           
        color: rgb(217, 227, 54);            
        padding: 20px;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 0 10px #333;  
    }
    input {
        font-family: Comic Sans MS, sans-serif;
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 16px;
        background: #222;         
        color: rgb(243, 252, 94);              
        border: 1px solid rgb(217, 227, 54);  
    }
    button {
        font-family: impact;
        margin-top: 15px;
        padding: 10px;
        width: 100%;
        font-size: 25px;
        background: rgb(217, 227, 54);         
        color: black;              
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: rgb(176, 161, 0);      
    }
    .result {
        margin-top: 15px;
        font-size: 18px;
        color: rgb(217, 227, 54);             
    }
</style>
</head>
<body>

<h1>Official MT-SB WPM Calculator</h1>
<h2>Word+Time Calculation</h2>


<div class="box">
    <input id="wordInput" type="text" placeholder="Word">
    <input id="timeInput" type="number" step="0.5" placeholder="Time taken (seconds)">
    <button onclick="WordCalculation()">Calculate WPM</button>
    <div id="wordResult" class="result"></div>
</div>
<h2>Word+WPM Calculation</h2>
<div class="box">
    <input id="secondwordinput" type="text" placeholder="Word">
    <input id="desiredwpm" type="number" placeholder="WPM">
    <button onclick="timeCalculation()">Calculate Time</button>
    <div id="timeResult" class="result"></div>
</div>

<script>

const SB_CONSTANT = 15.32333;
const MT_CONSTANT = 11.73336;

function WordCalculation() {
    let word = document.getElementById("wordInput").value.trim();
    let t = parseFloat(document.getElementById("timeInput").value);

    if (!word || isNaN(t) || t <= 0) return;

    let L = word.length;

    let sbWPM = (SB_CONSTANT * L) / t;
    let mtWPM = (MT_CONSTANT * L) / t;

    // integer limit stopper methinks
    if (sbWPM > 2147483647 || mtWPM > 2147483647) {
        document.getElementById("wordResult").innerHTML = "im not doing allat";
        return;
    }

    document.getElementById("wordResult").innerHTML =
        "Spelling Bee WPM: " + Number(sbWPM.toFixed(2)).toLocaleString() +
        "<br>MonkeyType WPM (slightly inaccurate): " + Number(mtWPM.toFixed(2)).toLocaleString();
}


function timeCalculation() {
    let word = document.getElementById("secondwordinput").value.trim();
    let target = parseFloat(document.getElementById("desiredwpm").value);

    if (!word || isNaN(target) || target <= 0) return;

    let L = word.length;
    
    let requiredTime = (SB_CONSTANT * L) / target;
   
    requiredTime = Math.round(requiredTime * 120) / 120;

    document.getElementById("timeResult").innerHTML =
        "Required time: " + requiredTime + " sec";
}

</script>

</body>
</html>
