<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WPMCalc</title>
<style>
    body {
        font-family: Comic Sans MS, sans-serif;
        background: black;         
        color: yellow;             
        padding: 40px;
        max-width: 600px;
        margin: auto;
    }
    h1 {
        text-align: center;
        color: yellow;              
    }
    .box {
        background: #111;           
        color: yellow;            
        padding: 20px;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 0 10px #333;  
    }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 16px;
        background: #222;         
        color: yellow;              
        border: 1px solid yellow;  
    }
    button {
        margin-top: 15px;
        padding: 10px;
        width: 100%;
        font-size: 16px;
        background: yellow;         
        color: black;              
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #e6e600;      
    }
    .result {
        margin-top: 15px;
        font-weight: bold;
        font-size: 18px;
        color: yellow;             
    }
</style>
</head>
<body>

<h1>Official SB-MT WPM Calculator</h1>


<div class="box">
    <input id="wordInput" type="text" placeholder="Word">
    <input id="timeInput" type="number" step="0.5" placeholder="Time taken (seconds)">
    <button onclick="calcFromWord()">Calculate WPM</button>
    <div id="wordResult" class="result"></div>
</div>


<div class="box">
    <input id="wordInput2" type="text" placeholder="Word">
    <input id="targetWpm" type="number" placeholder="WPM you want">
    <button onclick="calcRequiredTime()">Calculate Time</button>
    <div id="timeResult" class="result"></div>
</div>

<script>

const SB_CONSTANT = 15.32333;
const MT_CONSTANT = 11.73336;

function calcFromWord() {
    let word = document.getElementById("wordInput").value.trim();
    let t = parseFloat(document.getElementById("timeInput").value);

    if (!word || isNaN(t) || t <= 0) return;

    let L = word.length;

    let sbWPM = (SB_CONSTANT * L) / t;
    let mtWPM = (MT_CONSTANT * L) / t;

    // integer limit stopper methinks
    if (sbWPM > 2200000000 || mtWPM > 2200000000) {
        document.getElementById("wordResult").innerHTML = "im not doing allat";
        return;
    }

    document.getElementById("wordResult").innerHTML =
        "Spelling Bee WPM: " + Number(sbWPM.toFixed(2)).toLocaleString() +
        "<br>MonkeyType WPM (slightly inaccurate): " + Number(mtWPM.toFixed(2)).toLocaleString();
}


function calcRequiredTime() {
    let word = document.getElementById("wordInput2").value.trim();
    let target = parseFloat(document.getElementById("targetWpm").value);

    if (!word || isNaN(target) || target <= 0) return;

    let L = word.length;
    
    let requiredTime = (SB_CONSTANT * L) / target;
   
    requiredTime = Math.round(requiredTime * 120) / 120;

    document.getElementById("timeResult").innerHTML =
        "Required time: " + requiredTime + " sec";
}

</script>

</body>
</html>
